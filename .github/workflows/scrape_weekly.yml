name: Scrape — Weekly (water)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    name: DWS Water
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scrapers
        run: |
          mkdir -p data logs
          python run_scrapers.py --topics water
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: weekly update — water [skip ci]"
          file_pattern: "data/water.json data/manifest.json"
          commit_user_name: "Libo Insights Bot"
          commit_user_email: "actions@libo-insights.co.za"
          skip_dirty_check: false
