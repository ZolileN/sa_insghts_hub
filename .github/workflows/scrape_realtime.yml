name: Scrape — Realtime (forex + energy)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      topics:
        description: "Topics to scrape (default: forex energy)"
        required: false
        default: "forex energy"

jobs:
  scrape:
    name: Forex + Energy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        run: |
          mkdir -p data logs
          TOPICS="${{ github.event.inputs.topics || 'forex energy' }}"
          python run_scrapers.py --topics $TOPICS
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: realtime update — forex + energy [skip ci]"
          file_pattern: "data/forex.json data/energy.json data/manifest.json"
          commit_user_name: "Libo Insights Bot"
          commit_user_email: "actions@libo-insights.co.za"
          skip_dirty_check: false
