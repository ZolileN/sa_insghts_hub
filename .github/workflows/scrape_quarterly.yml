name: Scrape — Quarterly (all 10 topics)

on:
  schedule:
    - cron: "0 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      parallel:
        description: "Run scrapers in parallel?"
        type: boolean
        default: true

jobs:
  scrape:
    name: Full refresh — all 10 topics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all scrapers
        run: |
          mkdir -p data logs
          if [ "${{ github.event.inputs.parallel }}" = "true" ]; then
            python run_scrapers.py --parallel
          else
            python run_scrapers.py
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: libo-insights-data-${{ github.run_number }}
          path: data/
          retention-days: 90

      - name: Commit all updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: quarterly full refresh — all 10 topics [skip ci]"
          file_pattern: "data/*.json"
          commit_user_name: "Libo Insights Bot"
          commit_user_email: "actions@libo-insights.co.za"
          skip_dirty_check: false
